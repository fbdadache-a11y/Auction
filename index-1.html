<style>
:root{--bg:#f6f3ea;--ink:#2a2c2e;--mut:#8b8a83;--line:#dcd7c9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;line-height:1.7}
#app{max-width:720px;margin:0 auto;padding:36px 20px 64px}
h1{font-size:1.1rem;font-weight:700;margin:0 0 24px}
h2{font-size:1rem;font-weight:700;margin:0 0 12px}
p{margin:0 0 12px}
.mut{color:var(--mut);font-size:.9rem}
.stages{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:22px;font-size:.85rem;color:var(--mut)}
.stages .on{color:var(--ink);font-weight:700;border-bottom:2px solid var(--ink)}
.stages .done{text-decoration:line-through}
.teams{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.team{padding:16px 0 16px 18px}
.team+.team{border-right:1px solid var(--line);padding:16px 18px 16px 0}
.team b{font-weight:700}
.team.on b:before{content:"● "}
.money{font-size:2rem;font-weight:300;line-height:1.3}
.names{list-style:none;margin:8px 0 0;padding:0;font-size:.85rem;color:var(--mut)}
.names .need{color:var(--ink)}
.lot{text-align:center;padding:44px 0 32px}
.nm{font-size:2.8rem;font-weight:300;line-height:1.2}
.meta{color:var(--mut);margin:6px 0 26px}
.bid{font-size:4.5rem;font-weight:200;line-height:1.1}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
button{font:inherit;font-weight:700;font-size:.95rem;cursor:pointer;padding:10px 20px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:0}
button.alt{background:transparent;color:var(--ink)}
button:hover:not(:disabled){opacity:.8}
button:disabled{opacity:.25;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input{font:inherit;padding:9px 12px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:0;width:100%;margin:4px 0 16px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 18px}
.modes button{text-align:right;padding:12px 14px;font-weight:400}
.modes small{opacity:.7}
.panel{border-top:1px solid var(--line);padding-top:18px;text-align:center}
.rev{list-style:none;margin:0;padding:0}
.rev li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.9rem;opacity:0;animation:in .4s forwards}
.score{font-size:4rem;font-weight:200;text-align:center;line-height:1.2;margin-top:28px;opacity:0;animation:in .8s forwards}
.win{font-size:1.3rem;font-weight:700;margin-top:8px}
@keyframes in{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.rev li,.score{animation-duration:.01s;animation-delay:0s!important}}
@media (max-width:480px){.nm{font-size:2.1rem}.bid{font-size:3.4rem}.modes{grid-template-columns:1fr}}
.av{display:inline-block;width:28px;height:28px;border-radius:50%;background:var(--line);overflow:hidden;vertical-align:middle;margin-left:8px;text-align:center;line-height:28px;font-size:.75rem;color:var(--mut);flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.big{display:block;width:150px;height:150px;line-height:150px;font-size:3rem;margin:0 auto 18px}
.rev .av{margin-left:6px}
</style>
</head>

const need = i => Object.keys(S.form).filter(p => open(i, p)).map(p => `${POS[p]} ×${S.form[p] - cnt(i, p)}`).join('، ');
const slotsLeft = i => S.N + 1 - S.sq[i].length - (S.co[i] ? 1 : 0);
const maxBid = i => S.m[i] - (slotsLeft(i) - 1); // يبقى 1 م لكل مركز ناقص
const take = (list, item) => { list.splice(list.indexOf(item), 1); return item; };
const give = (i, it) => it.t === 'p' ? S.sq[i].push(it) : (S.co[i] = it);
const bonus = i => Math.round(S.co[i].r * S.N / 7);

function setMode(k) { names = [n0.value || names[0], n1.value || names[1]]; mode = k; setup(); }

function setup() {
  app.innerHTML = `<h1>مزاد الأساطير</h1>
  ${W[0] + W[1] ? `<p class="mut">النتيجة الإجمالية: ${names[0]} ${W[0]} - ${W[1]} ${names[1]}</p>` : ''}
  <label class="mut">الفريق الأول</label><input id="n0" value="${names[0]}">
  <label class="mut">الفريق الثاني</label><input id="n1" value="${names[1]}">
  <label class="mut">حجم الفريق</label>
  <div class="modes">${Object.entries(MODES).map(([k, m]) =>
    `<button class="${k === mode ? '' : 'alt'}" onclick="setMode('${k}')">${m.n}<br><small>${m.money} مليون لكل فريق</small></button>`).join('')}</div>
  <p class="mut">${ALL_P.length} لاعباً و${ALL_C.length} مدرباً، وتقييماتهم سرية حتى المباراة. الصور من ويكيبيديا وتحتاج إنترنت. يسير المزاد بالترتيب: الحراس ثم المدافعون ثم الوسط ثم المهاجمون ثم المدرب. كل شيء يُشترى: من يخسر المزاد على لاعب يشتري اللاعب التالي في المركز نفسه بسعر 1 م، ولا يصرف أي فريق ما يمنعه من إكمال تشكيلته.</p>
  <button id="go">ابدأ المزاد</button>`;
  go.onclick = () => {
    names = [n0.value || 'الفريق 1', n1.value || 'الفريق 2'];
    const m = MODES[mode];
    S = {n:names, m:[m.money, m.money], sq:[[], []], co:[null, null], stage:0, lotNo:0,
         P:[...ALL_P], C:[...ALL_C], form:m.form, N:Object.values(m.form).reduce((a, b) => a + b)};
    next();
  };
}

function head() {
  const st = ORD.map((p, i) => `<span class="${i < S.stage ? 'done' : i === S.stage ? 'on' : ''}">${LBL[p]}</span>`).join('');
  const tm = i => `<div class="team ${lot && lot.turn === i ? 'on' : ''}"><b>${S.n[i]}</b><div class="money">${S.m[i]} م</div>
    <ul class="names">${S.sq[i].map(p => `<li>${av(p)}${p.name} (${POS[p.pos]})</li>`).join('')}
    ${S.co[i] ? `<li>${av(S.co[i])}المدرب: ${S.co[i].name}</li>` : ''}${need(i) ? `<li class="need">ينقصه: ${need(i)}</li>` : ''}</ul></div>`;
  return `<h1>مزاد الأساطير</h1><div class="stages">${st}</div><div class="teams">${tm(0)}${tm(1)}</div>`;
}

function next() {
  while (S.stage < 5) {
    const pos = ORD[S.stage];
    const el = [0, 1].filter(i => pos === 'C' ? !S.co[i] : open(i, pos));
    if (el.length) {
      const item = pos === 'C' ? take(S.C, S.C[rnd(S.C.length)])
        : (c => take(S.P, c[rnd(c.length)]))(S.P.filter(p => p.pos === pos));
      lot = {item, el, bid:0, last:null, turn:el.length === 2 ? S.lotNo % 2 : el[0]};
      S.lotNo++;
      return el.length === 2 ? auction() : solo();
    }
    S.stage++;
  }
  match();
}

function lotCard(it) {
  return `<div class="lot">${av(it, 'big')}<div class="nm">${it.name}</div>
  <div class="meta">${it.t === 'c' ? 'مدرب، خبرته سرية' : `${POS[it.pos]} · ${it.e === 'P' ? 'من الماضي' : 'من الحاضر'} · تقييمه سري`}</div>`;
}

function solo() {
  const w = lot.el[0];
  app.innerHTML = head() + lotCard(lot.item) + `<p>لا ينافسك أحد على هذا المركز، يشتريه <b>${S.n[w]}</b> بسعر 1 م.</p>
  <button onclick="resolve(${w},1)">اشترِ بـ 1 م</button></div>`;
}

function auction() {
  const t = lot.turn, mx = maxBid(t);
  if (lot.bid > 0 && mx <= lot.bid) return resolve(lot.last, lot.bid); // لا يستطيع الرفع: يُغلق المزاد
  const btns = [1, 5, 10, 25].map(x => `<button onclick="raise(${lot.bid + x})" ${lot.bid + x > mx ? 'disabled' : ''}>+${x}</button>`).join('');
  app.innerHTML = head() + lotCard(lot.item) + `
    <div class="mut">السعر الحالي${lot.last !== null ? ` · آخر مزايد: ${S.n[lot.last]}` : ''}</div>
    <div class="bid">${lot.bid} م</div></div>
  <div class="panel"><p><b>الدور على ${S.n[t]}</b> <span class="mut">· أقصى مبلغ يستطيعه ${mx} م</span></p>
    <div class="row">${btns}<button onclick="raise(${mx})" ${mx <= lot.bid ? 'disabled' : ''}>الحد الأقصى</button></div>
    <div class="row"><input id="cb" type="number" min="${lot.bid + 1}" max="${mx}" placeholder="مبلغ آخر" style="width:140px;margin:0">
      <button onclick="raise(+cb.value)">زايد</button>
      <button class="alt" onclick="pass()" ${lot.bid === 0 ? 'disabled' : ''}>انسحب</button></div>
    ${lot.bid === 0 ? '<p class="mut" style="margin-top:10px">يجب فتح المزاد بمبلغ لا يقل عن 1 م.</p>' : ''}</div>`;
}
function raise(v) {
  v = Math.floor(v);
  if (!(v > lot.bid && v <= maxBid(lot.turn))) return alert('المبلغ يجب أن يكون أعلى من السعر الحالي ولا يتجاوز الحد الأقصى.');
  lot.bid = v; lot.last = lot.turn; lot.turn = 1 - lot.turn; auction();
}
function pass() { resolve(1 - lot.turn, lot.bid); }

function resolve(w, price) {
  S.m[w] -= price; give(w, lot.item);
  lot.turn = null;
  app.innerHTML = head() + `<div class="lot"><p><b>${S.n[w]}</b> اشترى <b>${lot.item.name}</b> بـ ${price} م.</p>
  <button onclick="next()">التالي</button></div>`;
}

function poisson(l) { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; }

function match() {
  const P = [0, 1].map(i => ({total:S.sq[i].reduce((a, p) => a + p.r, 0) + bonus(i)}));
  const lam = (a, b) => Math.min(4.5, 1.6 * Math.pow(a / b, 5));
  const g = [poisson(lam(P[0].total, P[1].total)), poisson(lam(P[1].total, P[0].total))];
  let w, pens = false;
  if (g[0] === g[1]) { pens = true; w = Math.random() < P[0].total / (P[0].total + P[1].total) ? 0 : 1; }
  else w = g[0] > g[1] ? 0 : 1;
  W[w]++;
  let d = 0;
  const step = () => (d += .2).toFixed(2);
  const li = (a, b) => `<li style="animation-delay:${step()}s"><span>${a}</span><b>${b}</b></li>`;
  const col = i => `<div><h2>${S.n[i]}</h2><ul class="rev">
    ${S.sq[i].map(p => li(`${av(p)}${p.name} (${POS[p.pos]})`, p.r)).join('')}
    ${li(`${av(S.co[i])}المدرب ${S.co[i].name}`, '+' + bonus(i))}${li('القوة الكلية', P[i].total)}</ul></div>`;
  app.innerHTML = `<h1>المباراة</h1><div class="teams" style="border:0">${col(0)}${col(1)}</div>
  <div class="score" style="animation-delay:${(d += .6).toFixed(2)}s">${g[0]} - ${g[1]}${pens ? '<div class="mut">تعادل وحُسمت بركلات الترجيح</div>' : ''}</div>
  <div class="score win" style="animation-delay:${(d += .8).toFixed(2)}s">الفائز: ${S.n[w]}<div class="mut" style="font-weight:400">النتيجة الإجمالية: ${W[0]} - ${W[1]}</div></div>
  <p style="text-align:center;margin-top:32px"><button onclick="setup()">لعبة جديدة</button></p>`;
}
setup();
</script>
</body>
</html>
