<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مزاد الأساطير</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Teko:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" async></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js" async></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" async onload="window.__lu&&__lu()"></script>
<style>
:root{--bg:#F6F5F0;--surface:#FFFFFF;--ink:#161618;--line:#E0DDD5;--slate:#2D2D32;--mut:#62626A;--pitch1:#1F4D34;--pitch2:#245A3C;--r:6px;--r-s:4px;--kit:#2D2D32}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;font-weight:600;line-height:1.55}
#app{max-width:1000px;margin:0 auto;padding:12px 16px 72px}
h1,h2,h3,p{margin:0}
.num{font-family:Teko,Cairo,system-ui,sans-serif;font-weight:700;line-height:.95;letter-spacing:.01em}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.ltr small{font-size:.55em;margin-inline-start:2px;font-weight:600}
.pr{display:inline-flex;gap:.3em;align-items:baseline}
.mut{color:var(--mut)}
small{font-size:.85rem}
kbd{font:inherit;font-size:.65rem;opacity:.65;border:1px solid currentColor;border-radius:3px;padding:0 4px;margin-inline-start:6px;font-weight:600}
@media (hover:none){kbd{display:none}}
svg.lucide{width:1.1em;height:1.1em;stroke-width:2.2;vertical-align:-.15em}

/* ===== الشريط العلوي ===== */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.1rem;white-space:nowrap}
.tools{display:flex;align-items:center;gap:8px}
.chip{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:2px 10px;font-size:.85rem}
.chip .num{font-size:1.15rem}

/* ===== الأزرار ===== */
button{font:inherit;font-weight:700;font-size:.95rem;cursor:pointer;padding:9px 18px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:var(--r-s);transition:background .15s,transform .1s}
button:hover:not(:disabled){background:var(--slate);border-color:var(--slate)}
button:active:not(:disabled){transform:translateY(1px)}
button.alt{background:transparent;color:var(--ink);border-color:var(--line)}
button.alt:hover:not(:disabled){background:var(--surface);border-color:var(--ink);color:var(--ink)}
button.sm,.icon-btn{padding:3px 12px;font-size:.85rem}
.icon-btn{background:transparent;color:var(--ink);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.icon-btn:hover:not(:disabled){background:var(--surface);color:var(--ink);border-color:var(--ink)}
button.go{font-size:1.1rem;padding:12px 30px}
button:disabled{opacity:.3;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.row.c{justify-content:center}
input{font:inherit;font-weight:600;width:100%;padding:8px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-s)}
input[type=number]{width:140px}
.err{font-weight:700;margin-top:8px}

/* ===== الصور ===== */
.av{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;flex:none;border-radius:var(--r-s);background:var(--bg);border:1px solid var(--line);overflow:hidden;font-size:.75rem;color:var(--mut);font-weight:700}
.av img{width:100%;height:100%;object-fit:cover;display:block}

/* ===== بطاقة اللاعب (على طريقة FIFA) ===== */
.fc{--w:220px;--shape:polygon(13% 0,87% 0,100% 6%,100% 87%,50% 100%,0 87%,0 6%);width:var(--w);height:calc(var(--w) * 1.4);font-size:calc(var(--w) * .0727);position:relative;flex:none;background:var(--ink);clip-path:var(--shape)}
.fc-in{position:absolute;inset:2px;clip-path:var(--shape);background:linear-gradient(165deg,#fff 0,#F1EFE7 100%);color:var(--ink);overflow:hidden}
.fc.past{background:#B9B29C}
.fc.past .fc-in{background:linear-gradient(165deg,#3A3A40 0,#161618 100%);color:#F6F5F0}
.fc.coach .fc-in{background:linear-gradient(165deg,#E9E5D8 0,#D8D3C2 100%)}
.fc-top{position:absolute;top:10%;inset-inline-start:10%;text-align:center;line-height:1}
.fc-r{font-size:3.1em}
.fc-r.hid{font-family:Cairo,sans-serif;font-size:2.4em;opacity:.55}
.fc-p{font-size:.85em;font-weight:900;margin-top:2px}
.fc-ph{position:absolute;top:8%;inset-inline-end:5%;width:62%;height:52%}
.fc-ph .av{width:100%;height:100%;border:0;background:transparent;font-size:3.2em;border-radius:0;-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent)}
.fc-ph .av img{object-position:center top}
.fc-nm{position:absolute;bottom:19%;inset-inline:7%;text-align:center;font-weight:900;font-size:1.3em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-lg{position:absolute;bottom:10%;inset-inline:4%;text-align:center;font-size:.72em;opacity:.7;white-space:nowrap}
.fc.fresh{animation:dealin .5s cubic-bezier(.2,1.2,.4,1) both}
.stamp-w{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:3}
.stamp{transform:rotate(-8deg);border:4px solid var(--kit);color:var(--kit);background:rgba(255,255,255,.94);font-weight:900;font-size:1.7em;padding:2px 16px;border-radius:var(--r);text-align:center;line-height:1.25;white-space:nowrap}
.stamp small{display:block;font-size:.5em;color:var(--ink)}

/* ===== لوحة النتائج ===== */
.sb{display:grid;grid-template-columns:1fr minmax(120px,auto) 1fr;background:var(--ink);color:#fff;border-radius:var(--r);overflow:hidden}
@media (min-width:720px){.sb{position:sticky;top:8px;z-index:20}}
.sbt{padding:10px 18px 12px;border-top:5px solid var(--kit);min-width:0}
.sbt.on{background:var(--slate)}
.sbh{display:flex;align-items:center;gap:8px;min-height:24px}
.sbn{font-weight:900;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbm{font-size:2.9rem;margin-top:2px}
.sbs{font-size:.8rem;opacity:.7}
.sbs .ltr small{font-size:.8em}
.turn{background:var(--kit);color:#fff;font-size:.7rem;font-weight:700;padding:0 8px;border-radius:3px;white-space:nowrap;border:1px solid #fff5}
.turn.ok{background:#fff;color:var(--ink);border-color:#fff}
.sbc{padding:8px 14px;text-align:center;border-inline:1px solid #ffffff22;display:flex;flex-direction:column;justify-content:center;gap:4px}
.sbc .st{font-weight:900;font-size:1rem}
.sbc .ln{font-size:.78rem;opacity:.75}
.prog{height:4px;background:#ffffff26;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:#fff;width:0;transition:width .3s}
.steps{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
.steps .on{color:var(--ink);font-weight:900;border-bottom:2px solid var(--ink)}
.steps .done{text-decoration:line-through;opacity:.6}

/* ===== منصة المزاد ===== */
.stage{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;margin:16px 0 22px}
.stage-card{position:relative}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.turnbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-inline-start:5px solid var(--kit);background:var(--bg);padding:6px 12px;border-radius:var(--r-s);margin-bottom:12px}
.turnbar b{font-weight:900}
.lbl{font-size:.8rem;color:var(--mut);line-height:1.3}
.price{font-size:6.2rem;margin:2px 0 4px}
.pulse{animation:pulse .35s ease-out}
.by{font-size:.9rem;color:var(--mut);margin-bottom:12px;min-height:1.4em}
.by b{color:var(--ink)}
.bids{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bids button{font-size:1.9rem;padding:8px 0 4px;line-height:1;display:flex;align-items:baseline;justify-content:center;gap:4px}
.bids2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.custom{display:flex;gap:8px;margin-top:12px;align-items:center}

/* ===== الملعب ===== */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:14px 0}
.tp-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tp-h b{font-weight:900}
.tp-h .num{font-size:1.2rem;margin-inline-start:auto}
.sw{width:14px;height:14px;border-radius:3px;background:var(--kit);flex:none}
.pitch{position:relative;aspect-ratio:5/5.4;border-radius:var(--r);overflow:hidden;background:repeating-linear-gradient(0deg,var(--pitch1) 0 8.333%,var(--pitch2) 8.333% 16.666%);border:1px solid #14301f}
.pitch svg{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);width:78px;display:flex;justify-content:center}
.pk{display:flex;flex-direction:column;align-items:center;gap:3px;max-width:100%}
.slot .box{width:46px;height:46px;border-radius:var(--r-s);border:2px dashed rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75);font-size:.62rem;line-height:1.1;font-weight:700;text-align:center}
.slot.target .box{border-color:#fff;color:#fff;animation:blink 1.1s ease-in-out infinite}
.slot .av{width:46px;height:46px;border:2px solid #fff;border-bottom:4px solid var(--kit);background:#fff}
.slot .sn{font-size:.66rem;font-weight:700;color:#fff;background:rgba(0,0,0,.6);border-radius:3px;padding:0 5px;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.5}
.pop{animation:popin .5s cubic-bezier(.2,1.6,.4,1)}
.rt{font-size:.9rem;font-weight:700;background:#fff;color:var(--ink);border-radius:3px;padding:0 6px;min-width:36px;text-align:center;line-height:1.35}
.rt.hid{background:rgba(0,0,0,.6);color:#fff}
.rt.on{animation:popin .35s}
.coach-row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.9rem}

/* ===== الأساسيات: بطاقات وسجل ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card h3,.ttl{font-size:1.05rem;font-weight:900;margin-bottom:10px}
.log ul{list-style:none;margin:0;padding:0;font-size:.9rem}
.log li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log li span{color:var(--mut)}
.log .num{font-size:1.25rem}

/* ===== الإعداد ===== */
.hero{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:24px;padding:8px 0 4px}
.hero h1{font-size:3rem;font-weight:900;line-height:1.1;margin-bottom:10px}
.hero p{color:var(--mut);font-size:1.05rem;max-width:34ch}
.fan{position:relative;height:300px;overflow:hidden}
.fan .fc{--w:150px;position:absolute;top:30px;left:50%;margin-left:-75px;transform-origin:50% 100%}
.fan .fc:nth-child(1){transform:translateX(-104px) rotate(-9deg)}
.fan .fc:nth-child(2){transform:translateY(-14px);z-index:2}
.fan .fc:nth-child(3){transform:translateX(104px) rotate(9deg)}
.teams2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tb label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:4px}
.sws{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.swb{width:26px;height:26px;padding:0;border-radius:var(--r-s);background:var(--c);border:2px solid var(--surface);outline:1px solid var(--line)}
.swb:hover:not(:disabled){background:var(--c);border-color:var(--surface);outline-color:var(--ink)}
.swb[aria-pressed=true]{outline:2px solid var(--ink)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.modes button,.lgs button{background:var(--surface);color:var(--ink);border:1px solid var(--line);text-align:right;font-weight:600}
.modes button[aria-pressed=true],.lgs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.modes button:hover:not(:disabled),.lgs button:hover:not(:disabled){border-color:var(--ink);background:var(--surface);color:var(--ink)}
.modes button[aria-pressed=true]:hover,.lgs button[aria-pressed=true]:hover{background:var(--slate);color:#fff}
.modes button>small{display:block;opacity:.75;font-weight:600}
.lgs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.lgs button{padding:6px 12px}
.lgs small{margin-inline-start:6px;opacity:.7}
.sec{font-size:.85rem;color:var(--mut);margin:16px 0 6px}
.warn{font-weight:700}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;list-style:none;margin:16px 0 4px;padding:0;font-size:.9rem}
.how li{display:flex;gap:10px;align-items:flex-start;padding:10px;background:var(--bg);border-radius:var(--r-s)}
.how svg{flex:none;margin-top:3px}

/* ===== الكشف والمباراة ===== */
.tots{margin-top:0}
.tot{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--kit);border-radius:var(--r);padding:10px 14px}
.tr{display:flex;justify-content:space-between;align-items:baseline;padding:2px 0;font-size:.9rem}
.tr .num{font-size:1.5rem}
.tr.big{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-weight:900}
.tr.big .num{font-size:2.4rem}
.sb.live .sbm{font-size:5rem;text-align:center;margin-top:0}
.sb.live .sbh{justify-content:center}
.clock{font-size:3rem}
.feed{list-style:none;margin:16px 0;padding:0}
.ev{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--kit);border-radius:var(--r-s);padding:6px 12px;margin-bottom:6px;animation:rise .3s both}
.ev .num{font-size:1.4rem;min-width:44px;direction:ltr}
.ev.mark{border-inline-start-color:var(--line);color:var(--mut);font-size:.9rem}
.final{text-align:center;padding:26px 16px 22px;background:var(--ink);color:#fff;border-radius:var(--r);border-top:6px solid var(--kit);margin-top:18px;animation:rise .5s both}
.final svg.lucide{width:44px;height:44px}
.final .whistle{font-weight:700;opacity:.8}
.final .fw{font-size:1.6rem;font-weight:900;margin:4px 0}
.final .fs{font-size:5rem;margin:6px 0}
.final .sub{opacity:.8;font-size:.95rem}

/* ===== حركة ===== */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes popin{from{transform:scale(0) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@keyframes dealin{from{opacity:0;transform:translateY(-34px) rotate(-5deg) scale(.92)}to{opacity:1;transform:none}}
@keyframes blink{50%{background:rgba(255,255,255,.18)}}
.enter{animation:rise .4s both}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===== الشاشات الصغيرة ===== */
@media (max-width:720px){
  .top .chip{display:none}
  .sbh{flex-wrap:wrap;gap:2px 8px}.sbn{white-space:normal;line-height:1.25}
  .fan .fc{--w:132px;margin-left:-66px}
  .fan .fc:nth-child(1){transform:translateX(-84px) rotate(-9deg)}
  .fan .fc:nth-child(3){transform:translateX(84px) rotate(9deg)}
  .hero{grid-template-columns:1fr}.hero h1{font-size:2.3rem}.fan{height:250px}
  .stage{grid-template-columns:1fr;justify-items:center;gap:16px}
  .stage>.panel,.stage>div:last-child{width:100%}
  .price{font-size:4.8rem}
  .pair{grid-template-columns:1fr;max-width:420px;margin-inline:auto}
  .sbt{padding:8px 10px 10px}.sbm{font-size:2.2rem}.sbn{font-size:.9rem}
  .sbc{padding:6px 8px}.sbc .st{font-size:.85rem}
  .teams2,.modes,.how{grid-template-columns:1fr}
  .sb.live .sbm{font-size:3.6rem}.clock{font-size:2.2rem}.final .fs{font-size:4rem}
}
</style>
</head>

const sndGoal = () => tone('triangle', [523, 659, 784, 1046], .11, .22);
const sndWhistle = () => tone('sine', [2300, 2000, 2300, 2000], .1, .09);
const sndBtn = () => `<i data-lucide="${muted ? 'volume-x' : 'volume-2'}"></i><span>${muted ? 'الصوت متوقف' : 'الصوت يعمل'}</span>`;
function toggleSound() {
  muted = !muted;
  try { localStorage.setItem('muted', muted ? '1' : '0'); } catch (e) {}
  document.querySelectorAll('[data-snd]').forEach(b => b.innerHTML = sndBtn());
  fx.icons(); sndBid();
}

/* ========== الصور من ويكيبيديا ========== */
const ITEMS = {}, IMG = {}, URLS = {};
const WIKI = 'https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&piprop=thumbnail&pithumbsize=360&redirects=1&format=json&origin=*';
async function wq(extra) {
  const j = await (await fetch(WIKI + extra)).json();
  const pg = j.query && j.query.pages;
  if (pg) for (const k in pg) if (pg[k].thumbnail) return pg[k].thumbnail.source;
  return null;
}
function getImg(it) {
  const k = it.en;
  if (IMG[k]) return IMG[k];
  IMG[k] = (async () => {
    try { const c = localStorage.getItem('img:' + k); if (c !== null) return c || null; } catch (e) {}
    try {
      let u = await wq('&titles=' + encodeURIComponent(k));
      if (!u) u = await wq('&generator=search&gsrlimit=1&gsrsearch=' + encodeURIComponent(k.replace(/\s*\(.*\)/, '') + (it.t === 'c' ? ' football manager' : ' footballer')));
      try { localStorage.setItem('img:' + k, u || ''); } catch (e) {}
      return u;
    } catch (e) { delete IMG[k]; return null; }
  })();
  return IMG[k];
}
const av = (it, cls) => {
  ITEMS[it.en] = it;
  if (URLS[it.en]) return `<span class="av ${cls || ''}" data-k="${esc(it.en)}" data-d="1"><img src="${esc(URLS[it.en])}" alt=""></span>`;
  return `<span class="av ${cls || ''}" data-k="${esc(it.en)}"><span>${esc(it.name[0])}</span></span>`;
};
function hydrate() {
  document.querySelectorAll('.av[data-k]:not([data-d])').forEach(el => {
    el.dataset.d = 1;
    const it = ITEMS[el.dataset.k];
    if (!it) return;
    getImg(it).then(u => {
      if (!u) return;
      URLS[it.en] = u;
      if (!el.isConnected) return;
      const im = new Image(); im.alt = '';
      im.onload = () => { el.textContent = ''; el.appendChild(im); };
      im.src = u;
    });
  });
}
function render(html, after) { app.innerHTML = html; fx.icons(); hydrate(); if (after) after(); }

/* ========== مساعدات اللعبة ========== */
const T = i => esc(S.n[i]);
const cnt = (i, pos) => S.sq[i].filter(p => p.pos === pos).length;
const open = (i, pos) => cnt(i, pos) < S.form[pos];
const need = i => Object.keys(S.form).filter(p => open(i, p)).map(p => `${POS[p]} ×${S.form[p] - cnt(i, p)}`).join('، ');
const slotsLeft = i => S.N + 1 - S.sq[i].length - (S.co[i] ? 1 : 0);
const maxBid = i => S.m[i] - (slotsLeft(i) - 1); // يبقى 1M لكل مركز ناقص
const take = (list, item) => { list.splice(list.indexOf(item), 1); return item; };
const give = (i, it) => it.t === 'p' ? S.sq[i].push(it) : (S.co[i] = it);
const bonus = i => Math.round(S.co[i].r * S.N / 7);
const done = i => !need(i) && S.co[i];

/* ========== بطاقة اللاعب والمكوّنات ========== */
function fcard(it, o) {
  o = o || {};
  const past = it.t === 'p' && it.e === 'P';
  const r = o.rating != null ? o.rating : '؟؟';
  const pos = it.t === 'c' ? 'مدرب' : POS[it.pos];
  const lg = it.t === 'c' ? 'خبرته سرية' : `${LG[it.lg]} · ${past ? 'من الماضي' : 'من الحاضر'}`;
  return `<div class="fc ${it.t === 'c' ? 'coach' : past ? 'past' : ''} ${o.fresh ? 'fresh' : ''}" ${o.w ? `style="--w:${o.w}px"` : ''}><div class="fc-in">
    <div class="fc-top"><div class="fc-r num ${o.rating != null ? '' : 'hid'}">${r}</div><div class="fc-p">${pos}</div></div>
    <div class="fc-ph">${av(it)}</div><div class="fc-nm">${esc(it.name)}</div><div class="fc-lg">${lg}</div></div>${o.stamp || ''}</div>`;
}
function pitchHTML(i, o) {
  o = o || {};
  const xy = FORM_XY[S.mode];
  let h = `<div class="pitch" style="--kit:${S.k[i]}">${PITCH_SVG}`;
  for (const pos of 'GDMF') {
    const list = S.sq[i].filter(p => p.pos === pos);
    xy[pos].forEach(([x, y], j) => {
      const p = list[j];
      if (p) h += `<div class="slot filled" data-id="${esc(p.en)}" style="left:${x}%;top:${y}%"><div class="pk">${av(p)}<span class="sn">${esc(p.name)}</span>${o.reveal ? `<span class="rt hid" data-r="${p.r}">؟؟</span>` : ''}</div></div>`;
      else h += `<div class="slot${S.stage < 5 && ORD[S.stage] === pos ? ' target' : ''}" style="left:${x}%;top:${y}%"><div class="pk"><span class="box">${POS[pos]}</span></div></div>`;
    });
  }
  return h + '</div>';
}
function teamPitch(i, o) {
  return `<div class="tp"><div class="tp-h" style="--kit:${S.k[i]}"><span class="sw"></span><b>${T(i)}</b><span class="num mut">${S.sq[i].length}/${S.N}</span></div>${pitchHTML(i, o)}
    <div class="coach-row">${S.co[i] ? `${av(S.co[i])}<span>المدرب: <b>${esc(S.co[i].name)}</b></span>` : '<span class="mut">المدرب: لم يُشترَ بعد</span>'}</div></div>`;
}
const pitches = o => `<section class="pair">${teamPitch(0, o)}${teamPitch(1, o)}</section>`;
const topbar = () => `<header class="top"><div class="brand"><i data-lucide="gavel"></i><span>مزاد الأساطير</span></div><div class="tools">
  <span class="chip" id="modeChip">${MODES[mode].n} · <span class="num">${M(MODES[mode].money)}</span></span>
  <button class="icon-btn" data-snd onclick="toggleSound()" aria-label="تشغيل الصوت أو إيقافه">${sndBtn()}</button></div></header>`;
function board(turn) {
  const tm = i => `<div class="sbt${turn === i ? ' on' : ''}" style="--kit:${S.k[i]}"><div class="sbh"><span class="sbn">${T(i)}</span>${turn === i ? '<span class="turn">دوره</span>' : ''}${done(i) ? '<span class="turn ok">مكتمل</span>' : ''}</div>
    <div class="sbm num">${M(S.m[i])}</div><div class="sbs">المصروف ${M(S.spent[i])}</div></div>`;
  const total = 2 * S.N + 2;
  return `<section class="sb">${tm(0)}<div class="sbc"><div class="st">${LBL[ORD[Math.min(S.stage, 4)]]}</div><div class="ln">الصفقة <span class="num">${Math.min(S.lotNo, total)}</span> من <span class="num">${total}</span></div>
    <div class="prog"><i style="width:${Math.min(100, S.lotNo / total * 100)}%"></i></div></div>${tm(1)}</section>`;
}
const stepper = () => `<div class="steps">${ORD.map((p, i) => `<span class="${i < S.stage ? 'done' : i === S.stage ? 'on' : ''}">${LBL[p]}</span>`).join('')}</div>`;
function logCard() {
  if (!S.log.length) return '';
  return `<section class="card log"><h3>سجل الانتقالات</h3><ul>${S.log.slice(-6).reverse().map(e =>
    `<li><div><b>${esc(S.n[e.w])}</b> ضمّ ${esc(e.name)} <span>${e.label}</span></div><b class="num">${M(e.price)}</b></li>`).join('')}</ul></section>`;
}

/* ========== الإعداد ========== */
const pool = () => ALL_P.filter(p => lgs.has(p.lg));
function shortage() {
  const f = MODES[mode].form, P = pool();
  return Object.keys(f).filter(p => P.filter(x => x.pos === p).length < 2 * f[p])
    .map(p => `${POS[p]} (${P.filter(x => x.pos === p).length} من ${2 * f[p]})`);
}
function setup() {
  stopTimers(); lot = null;
  const fan = ALL_P.filter(p => p.r >= 96).sort(() => Math.random() - .5).slice(0, 3);
  const teamBox = i => `<div class="tb"><label for="n${i}">${i ? 'الفريق الثاني' : 'الفريق الأول'}</label><input id="n${i}" maxlength="20" value="${esc(names[i])}">
    <div class="sws" role="group" aria-label="لون القميص">${KITS.map(c => `<button class="swb" data-i="${i}" data-c="${c}" style="--c:${c}" aria-label="لون القميص" aria-pressed="${kits[i] === c}" onclick="pickKit(${i},'${c}')"></button>`).join('')}</div></div>`;
  render(topbar() + `<section class="hero"><div><h1>مزاد الأساطير</h1><p>زايد على نجوم الماضي والحاضر، وابنِ تشكيلتك، وتقييماتهم سرية حتى صافرة النهاية.</p></div>
    <div class="fan">${fan.map(p => fcard(p)).join('')}</div></section>
    <section class="card"><div class="teams2">${teamBox(0)}${teamBox(1)}</div>
      <div class="sec">حجم الفريق</div>
      <div class="modes">${Object.entries(MODES).map(([k, m]) => `<button data-m="${k}" aria-pressed="${k === mode}" onclick="setMode('${k}')">${m.n}<small>${M(m.money)} لكل فريق</small></button>`).join('')}</div>
      <div class="sec">دوريات اللاعبين المعروضين</div>
      <div class="lgs">${Object.keys(LG).map(k => `<button data-l="${k}" aria-pressed="${lgs.has(k)}" onclick="toggleLg('${k}')">${LGS[k]}<small>${LGCOUNT[k]}</small></button>`).join('')}</div>
      <div class="row" style="margin:0"><button class="alt sm" onclick="setLgs(Object.keys(LG))">كل الدوريات</button><button class="alt sm" onclick="setLgs(BIG5)">الخمسة الكبار</button></div>
      <p class="mut" id="avail" style="margin-top:10px"></p>
      <ol class="how"><li><i data-lucide="gavel"></i><span>زايد على لاعب يُعرض بتقييم سري، ومن يخسر المزاد يشتري اللاعب التالي.</span></li>
        <li><i data-lucide="users"></i><span>أكمل التشكيلة بالترتيب: الحراس ثم المدافعون ثم الوسط ثم المهاجمون ثم المدرب.</span></li>
        <li><i data-lucide="trophy"></i><span>تُكشف التقييمات وتُلعب المباراة، والأقوى لا يفوز دائماً.</span></li></ol>
      <div class="row"><button id="go" class="go">ابدأ المزاد</button></div></section>
    <p class="mut">${ALL_P.length} لاعباً و${ALL_C.length} مدرباً. الصور من ويكيبيديا وتحتاج إنترنت.</p>`, refreshSetup);
  $('go').onclick = start;
}
function refreshSetup() {
  document.querySelectorAll('[data-m]').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === mode));
  document.querySelectorAll('[data-l]').forEach(b => b.setAttribute('aria-pressed', lgs.has(b.dataset.l)));
  document.querySelectorAll('.swb').forEach(b => b.setAttribute('aria-pressed', kits[+b.dataset.i] === b.dataset.c));
  const chip = $('modeChip'); if (chip) chip.innerHTML = `${MODES[mode].n} · <span class="num">${M(MODES[mode].money)}</span>`;
  const sh = shortage(), n = pool().length;
  $('avail').innerHTML = !lgs.size ? '<span class="warn">اختر دورياً واحداً على الأقل.</span>'
    : sh.length ? `<span class="warn">الدوريات المختارة لا تكفي لهذا الحجم: ${sh.join('، ')}. أضف دورياً آخر أو صغّر الفريق.</span>`
    : `اللاعبون المتاحون في المزاد: ${n}`;
  $('go').disabled = !lgs.size || sh.length > 0;
}
function setMode(k) { mode = k; refreshSetup(); }
function toggleLg(k) { lgs.has(k) ? lgs.delete(k) : lgs.add(k); refreshSetup(); }
function setLgs(arr) { lgs = new Set(arr); refreshSetup(); }
function pickKit(i, c) { if (kits[1 - i] === c) kits[1 - i] = kits[i]; kits[i] = c; refreshSetup(); }

function start() {
  names = [$('n0').value.trim() || 'الفريق الأول', $('n1').value.trim() || 'الفريق الثاني'];
  if (names[0] === names[1]) names[1] += ' 2';
  const m = MODES[mode];
  S = {n:names, k:[...kits], mode, m:[m.money, m.money], spent:[0, 0], sq:[[], []], co:[null, null], stage:0, lotNo:0, log:[],
       P:pool(), C:[...ALL_C], form:m.form, N:Object.values(m.form).reduce((a, b) => a + b)};
  sndDeal();
  next();
}

/* ========== المزاد ========== */
function next() {
  stopTimers();
  while (S.stage < 5) {
    const pos = ORD[S.stage];
    const el = [0, 1].filter(i => pos === 'C' ? !S.co[i] : open(i, pos));
    if (el.length) {
      const item = pos === 'C' ? take(S.C, S.C[rnd(S.C.length)])
        : (c => take(S.P, c[rnd(c.length)]))(S.P.filter(p => p.pos === pos));
      lot = {item, el, bid:0, prev:0, last:null, err:'', mode:'', turn:el.length === 2 ? S.lotNo % 2 : el[0]};
      S.lotNo++;
      window.scrollTo(0, 0);
      return el.length === 2 ? auction({fresh:true}) : solo();
    }
    S.stage++;
  }
  match();
}

function solo() {
  const w = lot.el[0]; lot.mode = 'solo';
  render(topbar() + board(w) + stepper() + `<section class="stage"><div class="stage-card">${fcard(lot.item, {fresh:true})}</div>
    <div class="panel"><div class="turnbar" style="--kit:${S.k[w]}"><b>${T(w)}</b><span>لا منافس له على هذا المركز</span></div>
      <div class="lbl">السعر الثابت</div><div class="price num">${M(1)}</div>
      <p class="by">يضمّه ${T(w)} بسعر ${M(1)} فقط.</p>
      <button class="go" onclick="resolve(${w},1)">تقديم العرض <kbd>↵</kbd></button></div></section>` + pitches() + logCard());
}

function auction(o) {
  o = o || {};
  const t = lot.turn, mx = maxBid(t);
  if (lot.bid > 0 && mx <= lot.bid) return resolve(lot.last, lot.bid); // لا يستطيع الرفع: يُحسم المزاد
  lot.mode = 'auction';
  const btns = [1, 5, 20].map((x, k) => `<button onclick="raise(${lot.bid + x})" ${lot.bid + x > mx ? 'disabled' : ''}><span class="num">${M(x, '+')}</span><kbd>${[1, 5, 2][k]}</kbd></button>`).join('');
  render(topbar() + board(t) + stepper() + `<section class="stage"><div class="stage-card">${fcard(lot.item, {fresh:o.fresh})}</div>
    <div class="panel"><div class="turnbar" style="--kit:${S.k[t]}"><b>${T(t)}</b><span>دورك للمزايدة · أقصى عرض متاح ${M(mx)}</span></div>
      <div class="lbl">السعر الحالي</div>
      <div class="price num${o.pulse ? ' pulse' : ''}"><span class="ltr"><span id="pv">${lot.bid}</span><small>M</small></span></div>
      <div class="by">${lot.last !== null ? `آخر عرض من <b>${T(lot.last)}</b>` : 'افتح المزاد بعرض لا يقل عن 1M'}</div>
      <div class="bids">${btns}</div>
      <div class="bids2"><button onclick="raise(${mx})" ${mx <= lot.bid ? 'disabled' : ''}>كل الميزانية<kbd>M</kbd></button>
        <button class="alt" onclick="pass()" ${lot.bid === 0 ? 'disabled' : ''}>انسحاب<kbd>P</kbd></button></div>
      <div class="custom"><input id="cb" type="number" min="${lot.bid + 1}" max="${mx}" placeholder="مبلغ آخر" aria-label="مبلغ آخر"><button class="alt" onclick="raise(+$('cb').value)">زايد</button></div>
      ${lot.err ? `<div class="err">${lot.err}</div>` : ''}</div></section>` + pitches() + logCard(),
    () => { if (o.pulse) fx.count($('pv'), lot.bid, lot.prev, .35); });
}
function raise(v) {
  v = Math.floor(v);
  if (!(v > lot.bid && v <= maxBid(lot.turn))) { lot.err = 'العرض يجب أن يتجاوز السعر الحالي ولا يزيد على أقصى عرض متاح.'; return auction(); }
  sndBid();
  lot.prev = lot.bid; lot.bid = v; lot.last = lot.turn; lot.turn = 1 - lot.turn; lot.err = '';
  auction({pulse:true});
}
function pass() { sndPass(); resolve(1 - lot.turn, lot.bid); }

function resolve(w, price) {
  const it = lot.item;
  S.m[w] -= price; S.spent[w] += price; give(w, it);
  S.log.push({w, name:it.name, label:it.t === 'c' ? 'مدرب' : POS[it.pos], price});
  lot.mode = 'deal';
  sndDeal();
  const stamp = `<div class="stamp-w"><div class="stamp" id="stamp" style="--kit:${S.k[w]}">تم البيع<small>${esc(S.n[w])} · ${price}M</small></div></div>`;
  render(topbar() + board(null) + stepper() + `<section class="stage"><div class="stage-card">${fcard(it, {stamp})}</div>
    <div class="panel"><div class="turnbar" style="--kit:${S.k[w]}"><b>${T(w)}</b><span>أتمّ الصفقة</span></div>
      <div class="lbl">سعر البيع</div><div class="price num">${M(price)}</div>
      <p class="by">${T(w)} ضمّ <b>${esc(it.name)}</b> وبقي له ${M(S.m[w])}.</p>
      <button class="go" onclick="next()">الصفقة التالية <kbd>↵</kbd></button></div></section>` + pitches() + logCard(), () => {
    fx.slam($('stamp'));
    const el = it.t === 'c' ? document.querySelectorAll('.coach-row')[w] : [...document.querySelectorAll('.slot.filled')].find(e => e.dataset.id === it.en);
    const pk = el && (el.querySelector('.pk') || el);
    if (pk) pk.classList.add('pop');
    fx.boom({particleCount:45, spread:75, startVelocity:32, origin:fx.at(el), colors:[S.k[w], '#ffffff', '#161618']});
  });
}

document.addEventListener('keydown', e => {
  if (!lot || e.ctrlKey || e.metaKey || e.altKey || document.activeElement !== document.body) return;
  if (lot.mode === 'auction') {
    if (e.key === '1') raise(lot.bid + 1);
    else if (e.key === '5') raise(lot.bid + 5);
    else if (e.key === '2') raise(lot.bid + 20);
    else if (e.code === 'KeyM') raise(maxBid(lot.turn));
    else if (e.code === 'KeyP' && lot.bid > 0) pass();
  } else if (e.key === 'Enter') {
    if (lot.mode === 'deal') next(); else if (lot.mode === 'solo') resolve(lot.el[0], 1);
  }
});

/* ========== المباراة ========== */
function poisson(l) { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; }
function pick(list, wf) {
  const ws = list.map(wf); let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let i = 0; i < list.length; i++) { r -= ws[i]; if (r <= 0) return list[i]; }
  return list[list.length - 1];
}
function simulate() {
  const P = [0, 1].map(i => { const sum = S.sq[i].reduce((a, p) => a + p.r, 0); return {sum, bonus:bonus(i), total:sum + bonus(i)}; });
  const lam = (a, b) => Math.min(4.5, 1.6 * Math.pow(a / b, 5));
  const g = [poisson(lam(P[0].total, P[1].total)), poisson(lam(P[1].total, P[0].total))];
  let w, pens = null;
  if (g[0] === g[1]) {
    w = Math.random() < P[0].total / (P[0].total + P[1].total) ? 0 : 1;
    const win = 3 + rnd(3), lose = Math.max(0, win - 1 - rnd(2));
    pens = w === 0 ? [win, lose] : [lose, win];
  } else w = g[0] > g[1] ? 0 : 1;
  const wt = p => ({G:.02, D:.7, M:2.5, F:6}[p.pos]) * Math.pow(p.r / 80, 3);
  const events = [];
  for (let t = 0; t < 2; t++) for (let k = 0; k < g[t]; k++) events.push({t, min:1 + rnd(90), who:pick(S.sq[t], wt)});
  events.sort((a, b) => a.min - b.min);
  W[w]++;
  return {P, g, w, pens, events};
}
function match(skipReveal) {
  stopTimers(); lot = null; S.stage = 6;
  S.res = simulate();
  skipReveal ? live() : reveal();
}

function reveal() {
  const R = S.res;
  const tot = i => `<div class="tot" style="--kit:${S.k[i]}"><div class="tr"><span>مجموع اللاعبين</span><b class="num" data-t="sum${i}">؟؟</b></div>
    <div class="tr"><span>أثر المدرب</span><b class="num" data-t="bn${i}">؟؟</b></div><div class="tr big"><span>القوة الكلية</span><b class="num" data-t="tt${i}">؟؟</b></div></div>`;
  render(topbar() + `<h2 class="ttl">كشف التقييمات</h2>` + pitches({reveal:true}) + `<section class="pair tots">${tot(0)}${tot(1)}</section>
    <div class="row c"><button class="alt" id="skipRev">تخطّ الكشف</button><button class="go" id="startM" disabled>صافرة البداية</button></div>`, () => {
    window.scrollTo(0, 0);
    const per = [0, 1].map(i => [...document.querySelectorAll('.tp')[i].querySelectorAll('.rt')]);
    const q = [];
    for (let k = 0; k < Math.max(per[0].length, per[1].length); k++) [0, 1].forEach(i => { if (per[i][k]) q.push(per[i][k]); });
    const flip = (el, inst) => {
      if (!el.classList.contains('hid')) return;
      const r = +el.dataset.r; el.classList.remove('hid'); el.classList.add('on');
      if (inst) el.textContent = r; else { fx.count(el, r, Math.max(0, r - 25), .25); tone('triangle', [360 + (r - 60) * 9], .06, .1); }
    };
    const fin = () => {
      stopTimers();
      q.forEach(el => flip(el, true));
      [0, 1].forEach(i => {
        fx.count(document.querySelector(`[data-t="sum${i}"]`), R.P[i].sum, 0, .8);
        document.querySelector(`[data-t="bn${i}"]`).textContent = '+' + R.P[i].bonus;
        fx.count(document.querySelector(`[data-t="tt${i}"]`), R.P[i].total, 0, 1);
      });
      $('startM').disabled = false; $('skipRev').disabled = true; sndDeal();
    };
    let k = 0;
    TM = setInterval(() => { if (k >= q.length) fin(); else flip(q[k++]); }, 230);
    $('skipRev').onclick = fin;
    $('startM').onclick = live;
  });
}

function live() {
  const R = S.res; stopTimers();
  const sbt = i => `<div class="sbt" style="--kit:${S.k[i]}"><div class="sbh"><span class="sbn">${T(i)}</span></div><div class="sbm num" id="g${i}">0</div></div>`;
  render(topbar() + `<section class="sb live">${sbt(0)}<div class="sbc"><div class="clock num" id="clk"><span class="ltr">0'</span></div><div class="ln" id="half">الشوط الأول</div><div class="prog"><i id="cp"></i></div></div>${sbt(1)}</section>
    <ul class="feed" id="feed"></ul><div class="row c" id="lc"><button class="alt" id="skipM">تخطّ إلى النهاية</button></div><div id="fin"></div>`, () => {
    window.scrollTo(0, 0);
    const sc = [0, 0]; let m = 0, ev = 0;
    const feed = $('feed');
    const add = (html, cls, kit) => feed.insertAdjacentHTML('afterbegin', `<li class="ev ${cls || ''}" ${kit ? `style="--kit:${kit}"` : ''}>${html}</li>`);
    const goal = (e, quiet) => {
      sc[e.t]++; const el = $('g' + e.t); el.textContent = sc[e.t];
      add(`<span class="num"><span class="ltr">${e.min}'</span></span><span>⚽ <b>${esc(e.who.name)}</b> <span class="mut">· ${T(e.t)}</span></span>`, '', S.k[e.t]);
      if (!quiet) { sndGoal(); el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); fx.boom({particleCount:50, spread:70, startVelocity:35, origin:fx.at(el), colors:[S.k[e.t], '#ffffff']}); }
    };
    const end = () => {
      stopTimers(); sndWhistle();
      $('clk').innerHTML = `<span class="ltr">90'</span>`; $('cp').style.width = '100%'; $('half').textContent = 'انتهت المباراة';
      $('lc').remove();
      const w = R.w;
      $('fin').innerHTML = `<section class="final" style="--kit:${S.k[w]}"><i data-lucide="trophy"></i><div class="whistle">صافرة النهاية</div>
        <div class="fw">الفائز: ${T(w)}</div><div class="fs num">${pair(R.g[0], R.g[1])}</div>
        ${R.pens ? `<p class="sub">تعادل وحُسمت بركلات الترجيح ${pair(R.pens[0], R.pens[1])}</p>` : ''}
        <p class="sub">النتيجة الإجمالية بين الفريقين ${pair(W[0], W[1])}</p>
        <div class="row c"><button id="again" class="go" style="background:#fff;color:#161618;border-color:#fff">مباراة أخرى بنفس التشكيلتين</button><button class="alt" id="newg" style="color:#fff;border-color:#ffffff66">لعبة جديدة</button></div></section>`;
      fx.icons();
      $('again').onclick = () => match(true);
      $('newg').onclick = setup;
      fx.cannons([S.k[w], '#ffffff', '#161618'], 2400);
      $('fin').scrollIntoView({behavior:reduced ? 'auto' : 'smooth', block:'center'});
    };
    const step = () => {
      m++;
      $('clk').innerHTML = `<span class="ltr">${m}'</span>`; $('cp').style.width = (m / 90 * 100) + '%';
      if (m > 45) $('half').textContent = 'الشوط الثاني';
      while (ev < R.events.length && R.events[ev].min <= m) goal(R.events[ev++]);
      if (m >= 90) return end();
      if (m === 45) { $('half').textContent = 'استراحة بين الشوطين'; add('استراحة بين الشوطين', 'mark'); TM = setTimeout(step, 1000); }
      else TM = setTimeout(step, 95);
    };
    sndWhistle();
    add('صافرة البداية', 'mark');
    TM = setTimeout(step, 600);
    $('skipM').onclick = () => { stopTimers(); while (ev < R.events.length) goal(R.events[ev++], true); end(); };
  });
}
setup();
</script>
</body>
</html>
